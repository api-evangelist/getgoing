aid: getgoing
name: GetGoing
description: >-
  GetGoing is a cloud-based corporate travel and expense (T&E) management
  platform for small and midsize businesses, built and operated by BCD Travel.
  It combines self-service booking of flights, hotels, rental cars and rail with
  automated travel and expense policy enforcement, pre-trip approval flows,
  streamlined payments and invoicing, traveler safety and duty-of-care, and
  analytics dashboards in a single product that can be implemented in under two
  hours. GetGoing pairs the digital self-service experience with BCD Travel's
  global travel-management expertise and support, and is offered across the
  United States, United Kingdom, France, Germany, the Netherlands and Belgium.
  GetGoing does not publish a first-party public developer API; programmatic
  travel integration is provided by the separate, authorization-gated BCD Travel
  Developer Hub.
